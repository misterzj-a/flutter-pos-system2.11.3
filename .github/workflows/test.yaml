name: Tests

# 触发条件（修复：统一分支、取消过度忽略、修复逻辑）
on:
  push:
    branches:
      - master
      - main  # 兼容主流主分支
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "scripts/**"
      - "mkdocs.yaml"
      - "Makefile"
  pull_request:
    branches:
      - master
      - main
  workflow_dispatch:

jobs:
  code-checking:
    name: Check code format and testing
    runs-on: ubuntu-latest
    # 修复：正确判断分支前缀，不会误杀所有任务
    if: ${{ !startsWith(github.head_ref, 'ci/') }}
    steps:
      - uses: actions/checkout@v4

      # 修复：Flutter 版本不存在，替换为正确稳定版
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.22.3"
          cache: true
          channel: "stable"

      # 安装依赖
      - name: Install dependencies
        env:
          GH_READ_PAT: ${{ secrets.GH_READ_PAT }}
        run: |
          echo "https://oauth:$GH_READ_PAT@github.com" > ~/.git-credentials
          git config --global credential.helper store
          flutter pub get

      # 代码检查
      - name: Linter
        run: flutter analyze .

      # 代码格式化
      - name: Format
        run: |
          dart format --line-length 120 lib/l10n/gen || true
          dart format --set-exit-if-changed --show none --line-length 120 .

      # 测试逻辑
      - name: Testing
        if: github.event_name == 'pull_request'
        run: flutter test

      - name: Testing with Coverage
        if: github.event_name != 'pull_request'
        run: |
          sudo apt-get install -y lcov
          flutter test --coverage
          lcov --remove coverage/lcov.info "lib/l10n/gen/*" -o coverage/lcov.info

      # 上传覆盖率
      - name: Coverage to codecov
        if: github.event_name != 'pull_request'
        uses: codecov/codecov-action@v4
        with:
          file: coverage/lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
